[package]
name = "rocket-py"
version = "0.1.0"
edition = "2021"
description = "PyO3 bindings for rocket-core: single + vectorized RL environments."

[lib]
# Native module is `rocket_lander._core`; the pure-Python `rocket_lander`
# package (Gymnasium env etc.) re-exports from it.
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
rocket-core = { path = "../core" }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }
numpy = "0.22"
